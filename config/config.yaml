# ============================================================
# Soil-SCM: 土壤物理化学数值模式 主配置文件
# 类似 WRF namelist.input
# ============================================================

simulation:
  n_years: 50                    # 模拟年数 (default: 50)
  time_step: monthly             # 主时间步长: monthly
  sub_time_step_days: 0          # 子时间步长(天): 0=不启用, 1~7=启用
  scenario: natural              # 情景: natural/fertilizer/fertilizer_lime/precip_increase/temp_increase
  # 引擎模式 (v0.2.1 起默认 auto, 走官方 PHREEQC 真实化学):
  #   auto       = PHREEQC 可用则用官方引擎, 否则降级简化模式 (推荐, 默认)
  #   phreeqc    = 强制使用 PHREEQC (失败时降级简化模式)
  #   simplified = 始终使用简化动力学模式 (兜底)
  engine_mode: auto
  precip_infiltration: 0.05          # 降水入渗系数 (0~1): 实际进入土壤溶液的比例 (T3)
  n_layers: 1                        # WF2: 分层数 (1=单层, 4=多分层; 各层默认参数相同)
  enable_surface: false              # WF4: SURFACE 表面络合 (Hfo_s/Hfo_w 铁氧化物), P/Zn 吸附生效
  enable_pre_equilibration: true     # v0.5.0: 初始状态预平衡 (热力学自洽, 建议保持开启)
  pre_equilibration_max_steps: 60    # v0.5.0: 预平衡最大迭代步数
  # ---- L4 硝化两步动力学 (库存层, v0.3.0; v0.4.0 起 config 可配置) ----
  # 简化一阶转化: 尿素 → NH4+ (水解 k1) → NO3- (硝化 k2), 比例/月 (0~1)
  # 硝化产酸 2H+/mol N 注入 REACTION (酸化效应真实进入溶液); 氮形态为模型库存
  nitrification_k1: 1.0              # 尿素水解速率 (/月): 1.0=当月全水解 (urease 催化, 田间数天完成)
  nitrification_k2: 0.4              # 硝化速率 (/月): 每月 40% NH4+ → NO3- (酸性红壤硝化受抑, 保守量级)
  hydrology_seed: 42                 # v0.5.0: 随机降雨种子 (同 seed 可复现)
  bypass_fraction: 0.2               # v0.5.2: 大孔隙优先流比例 (0~1, 超基质 Ks 积水直通 L2, 携带原始降水化学)
  initial_psi_cm: -100               # v0.5.3: 初始基质势 (cm, 负值, 田间持水量; VGM 正算初始 θ, 化学溶液体积联动)

  # ---- L6 (v0.4.0): 逐层参数覆盖 (真实剖面约束, 仅 n_layers>1 时生效) ----
  layer_depths: null                 # 每层厚度 (cm), 长度必须 = n_layers; null=等分兜底; 每层 effective_depth 由此派生
  layer_overrides: []                # 逐层覆盖密集列表, 长度必须 = n_layers; [] = 无覆盖 (各层默认相同)
  # 可覆盖字段: ph / organic_matter / cec / bulk_density / exch_ca~exch_h / pCO2 / minerals
  #   (minerals = 矿物质量分数增量替换, 只替换指定矿物, 不归一化)
  # 部分覆盖: 未写字段回退默认; 空 {} 表示该层无覆盖; n_layers=1 时忽略 (单层护栏)
  # 示例 (4 层 0-10/10-20/20-40/40-60cm):
  #   layer_depths: [10, 10, 20, 20]
  #   layer_overrides:
  #     - ph: 4.5
  #       organic_matter: 30.0
  #       cec: 15.0
  #       bulk_density: 1.1
  #       exch_al: 3.0
  #       pCO2: 0.020
  #       minerals: {goethite: 0.10}
  #       clay_pct: 25            # v0.5.3 VGM 显式参数 (D8 ① 最高优先级, None=clay_pct 回归/兜底):
  #       vgm_theta_r: 0.06       #   残余含水量 (m³/m³)
  #       vgm_alpha: 0.025        #   进气值倒数 (1/cm)
  #       vgm_n: 1.30             #   孔隙分布指数 (>1)
  #     - {}
  #     - cec: 10.0
  #       bulk_density: 1.35
  #     - bulk_density: 1.5
  #       pCO2: 0.030

soil_data:
  input_file: data/soil_survey.csv
  exchangeable_ions_file: data/exchangeable_ions.csv
  soil_type: red_soil            # 土壤类型标识符(用于查矿物数据库)

  # v0.2.3: config 内联土壤参数 (优先读取; 填 -1 = 使用 data/ CSV 默认值)
  # 逻辑: 全部 -1 → 读取 CSV; 全部有效值 → 覆盖 CSV; 混合 → 报错
  survey:
    ph: -1                       # 初始 pH
    organic_matter: -1           # 有机质 (g/kg)
    cec: -1                      # 阳离子交换量 (cmol(+)/kg)
    bulk_density: -1             # 容重 (g/cm³)
    area: -1                     # 耕地面积 (ha)
    effective_depth: -1          # 有效土层厚度 (cm)
    available_p: -1              # 有效磷 (mg/kg)
    available_k: -1              # 速效钾 (mg/kg)
    texture: -1                  # 质地编码 1~9 (卡钦斯基制, 见 config/texture_code.json)
    sand_pct: -1                 # 砂粒 (%)
    silt_pct: -1                 # 粉粒 (%)
    clay_pct: -1                 # 黏粒 (%)

  exchangeable_ions:
    exch_ca: -1                  # 交换性 Ca (cmol(+)/kg)
    exch_mg: -1                  # 交换性 Mg (cmol(+)/kg)
    exch_k: -1                   # 交换性 K (cmol(+)/kg)
    exch_na: -1                  # 交换性 Na (cmol(+)/kg)
    exch_al: -1                  # 交换性 Al (cmol(+)/kg)
    exch_h: -1                   # 交换性 H (cmol(+)/kg)

climate:
  base_annual_precip: 1893.0     # 基准年降水量 (mm/yr)
  base_annual_temp: 25.0         # 基准年平均温度 (°C)
  precip_increase_rate: 0.02     # 情景3: 每年降水增加比例 (2%/yr)
  temp_increase_rate: 0.05       # 情景4: 每年增温幅度 (°C/yr)
  # v0.5.3 PET 通道 (D5): Oudin(2005) 为主 (仅需月均温+纬度), 固定气候态兜底
  latitude: 23.1                 # 站点纬度 (°N, 华南红壤典型; 广州 23.1/鹰潭 28.2)
  pet_method: oudin              # "oudin" | "fixed" (需 pet_monthly_climate) | "hargreaves" (v0.6.0)
                                 #   hargreaves_enhanced = v0.7.0 预留 (config 显式报错)
  pet_monthly_climate: null      # 12 值固定气候态月 PET (mm/month); null=Oudin 公式正算
  pet_correction_factor: null    # 12 值月度修正系数; null=[1.0]×12 恒等
  # v0.6.0 Hargreaves-Samani (Q8/Q9): 日较差 T_max−T_min (°C, 华南典型 6~10, 默认 8.0)
  #   T_max = T_mean + range/2, T_min = T_mean − range/2; 仅 pet_method=hargreaves 使用
  diurnal_range_deg: 8.0
  #  华南 Oudin 偏差修正示例 (v0.5.3水分平衡闭合.txt §6.1, 夏季低估/冬季高估):
  #  [0.95, 0.95, 1.0, 1.0, 1.0, 0.90, 0.85, 0.85, 0.90, 1.0, 1.05, 1.05]

fertilizer:
  # 农业农村部 2021 春季主要农作物科学施肥指导意见 (水稻, 产量 500 kg/ha)
  # 每次施用量 (kg/ha), 每年 3/6/9 月各施用一次
  n: 12.0              # 氮肥 (按 N 元素计, 推荐 10~13)
  p2o5: 4.0            # 磷肥 (按 P2O5 计, 推荐 3~4)
  k2o: 9.0             # 钾肥 (按 K2O 计, 推荐 8~10)
  mgo: 3.0             # 镁肥 (按 MgO 计, 推荐 2~3)
  znso4: 1.0           # 硫酸锌 (按 ZnSO4 计, 推荐 1~2)
  apply_months: [3, 6, 9]        # 施肥月份

lime:
  amount_per_apply: 45.0         # 生石灰 (按 CaO 计, 推荐 40~50), kg/ha/次
  apply_months: [3, 6, 9]        # 施用月份(与肥料一致)

soil_co2:
  pCO2_ref: 0.015                # 参考CO2分压 (atm)
  T_ref: 25.0                    # 参考温度 (°C)
  beta: 0.05                     # 温度响应系数 (1/°C)
  # 参考文献:
  #   Brook et al. (1983), Earth Surface Processes and Landforms, 8(1), 79-88.
  #   Davidson & Trumbore (1995), Tellus B, 47(5), 550-565.

precipitation_chemistry:
  # v0.2.3: config 内联降水化学 (优先); 全部 -1 → 读取 input_file JSON
  input_file: config/precip_chemistry_default.json
  ph: -1                     # 降水 pH, -1=使用JSON
  ions:
    Cl: -1                   # Cl⁻ 当量占比 %, -1=使用JSON
    SO4: -1                  # SO₄²⁻ 当量占比 %
    NO3: -1                  # NO₃⁻ 当量占比 %
    F: -1                    # F⁻ 当量占比 %
    Ca: -1                   # Ca²⁺ 当量占比 %
    NH4: -1                  # NH₄⁺ 当量占比 %
    Na: -1                   # Na⁺ 当量占比 %
    Mg: -1                   # Mg²⁺ 当量占比 %
    K: -1                    # K⁺ 当量占比 %
    H: -1                    # H⁺ 当量占比 %
  # 默认数据 (2026-08-12 更新, 据《2025年广东省生态环境状况公报》):
  #   pH=5.75, 离子当量占比%: Cl 18.4 / SO4 12.5 / NO3 10.8 / F 2.1 /
  #   Ca 20.9 / NH4 15.8 / Na 11.5 / Mg 5.1 / K 1.9 / H 1.0
  #   文件: config/precip_chemistry_default.json (unit=percent)

output:
  directory: ./output
  format: csv                    # 输出格式: csv / netcdf
  event_output: false            # v0.6.0: 逐场事件明细 CSV (event_leaching_<scenario>.csv); 默认关 (文件体积)
  variables: [pH, base_saturation, CEC_occupied, exchangeable_Ca,
              exchangeable_Al, mineral_mass, solution_ions,
              infiltration, drainage, stored_water, runoff, bypass_drainage,
              AET_mm, et_deficit_mm, soil_moisture, pCO2_eff,
              flush_NO3_peak_mmol, flush_base_peak_mmol]
